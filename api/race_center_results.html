<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Race Results | Pitmark Race Center</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#101010;color:#f3f3f3}*{box-sizing:border-box}body{margin:0}header{border-bottom:3px solid #ff5500;padding:18px max(16px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#ff7940}header a{font-weight:800;color:#fff;text-decoration:none}.accent{color:#ff5500}main{max-width:1050px;margin:0 auto;padding:22px 16px 70px}h1{font-size:clamp(28px,6vw,45px);margin:8px 0}p{color:#bbb}form{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}input,button{background:#222;border:1px solid #555;border-radius:8px;color:white;padding:12px;font:inherit;min-width:0}input{flex:1 1 190px}button{background:#ff5500;color:#101010;font-weight:800;border-color:#ff5500;cursor:pointer}article{border:1px solid #333;border-radius:12px;margin:12px 0;padding:17px;background:#1c1c1c}article h2{margin:6px 0;font-size:21px}small,.muted{color:#aaa}.tag{display:inline-block;text-transform:uppercase;border:1px solid #555;border-radius:5px;padding:3px 7px;font-size:11px;letter-spacing:.06em}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #333;padding:11px 7px;text-align:left}th{color:#aaa}tr:first-child td{font-weight:700}#details{margin-top:22px}#error{color:#ff9977}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ff5500;outline-offset:3px}
</style></head><body><header><a href="/race-center">PITMARK <span class="accent">RACE CENTER</span></a><a href="/race-center">← Back to Race Center</a></header><main><small>LEAVE YOUR MARK · RESULTS ARCHIVE</small><h1>Race <span class="accent">Results.</span></h1><p>Verified finishing orders from attributed motorsports sources. Official and provisional classifications are shown separately.</p><form id="filters"><input name="q" aria-label="Event name" placeholder="Event name"><input name="track" aria-label="Track" placeholder="Track"><input name="series" aria-label="Series" placeholder="Series"><button type="submit">Search results</button></form><div id="error" role="alert"></div><div id="list" aria-live="polite">Loading verified results…</div><section id="details" aria-live="polite"></section></main><script>
const list=document.getElementById('list'),details=document.getElementById('details'),err=document.getElementById('error');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){err.textContent='';details.innerHTML='';list.textContent='Loading verified results…';try{
const params=new URLSearchParams(new FormData(document.getElementById('filters')));const r=await fetch('/api/public/race-center/results?'+params);if(!r.ok)throw new Error('Results unavailable');const body=await r.json();list.innerHTML=body.results.length?body.results.map(x=>`<article><small>${esc(x.race_date)} · ${esc(x.series)}</small><h2><a href="?event=${encodeURIComponent(x.key)}">${esc(x.event_name)}</a></h2><p>${esc(x.track)}</p><span class="tag">${esc(x.status)}</span> <a href="?event=${encodeURIComponent(x.key)}">Full finishing order →</a></article>`).join(''):'<p>No verified results match these filters yet. Race Center will not invent finishers or placements.</p>';const key=new URL(location).searchParams.get('event');if(key)await show(key);
}catch(e){err.textContent='Could not load results. Please try again.';list.textContent='';}}
async function show(key){try{const r=await fetch('/api/public/race-center/results/'+encodeURIComponent(key));if(!r.ok)throw new Error();const {event:e}=await r.json();details.innerHTML=`<article><h2>${esc(e.event_name)}</h2><p>${esc(e.track)} · ${esc(e.race_date)} · ${esc(e.series)}</p><span class="tag">${esc(e.status)}</span><p>Source: <a target="_blank" rel="noopener noreferrer" href="${esc(e.source_url)}">${esc(e.source_name)}</a></p>${e.sessions.map(s=>`<h3>${esc(s.class_name)} — ${esc(s.session_name)}</h3><div style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>#</th><th>Driver</th><th>Start</th><th>Laps</th><th>Status</th></tr></thead><tbody>${s.entries.map(x=>`<tr><td>${esc(x.finish)}</td><td>${esc(x.car_number||'—')}</td><td>${esc(x.driver)}</td><td>${esc(x.start||'—')}</td><td>${esc(x.laps??'—')}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>`).join('')}</article>`;details.scrollIntoView({behavior:'smooth'});}catch(e){err.textContent='That result could not be loaded.'}}
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();history.replaceState(null,'','/race-center/results?'+new URLSearchParams(new FormData(e.target)));load()});window.addEventListener('popstate',load);load();
</script></body></html>
