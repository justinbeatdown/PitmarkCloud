name: PRT Role-Aware Production Smoke

on:
  push:
    branches:
      - fix/prt-role-aware-apply
    paths:
      - '.github/workflows/prt-role-aware-production-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live PRT role-aware pages and backend validation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://prt.pitmarkracing.com'
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$BASE/prt?smoke=role-aware-1f1f5110" -o /tmp/prt.html
          grep -F '/prt/apply?role=driver' /tmp/prt.html
          grep -F '/prt/apply?role=league' /tmp/prt.html
          grep -F '/prt/apply?role=broadcaster' /tmp/prt.html
          grep -F '/prt/apply?role=media' /tmp/prt.html

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$BASE/prt/apply?role=broadcaster&smoke=role-aware-1f1f5110" -o /tmp/apply.html
          grep -F 'name="applicant_role"' /tmp/apply.html
          grep -F 'value="broadcaster"' /tmp/apply.html
          grep -F '/prt-apply.js?v=02150' /tmp/apply.html

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$BASE/prt-apply.js?v=02150&smoke=role-aware-1f1f5110" -o /tmp/apply.js
          grep -F "quick-apply-driver" /tmp/apply.js
          grep -F "quick-apply-league" /tmp/apply.js
          grep -F "quick-apply-broadcaster" /tmp/apply.js
          grep -F "quick-apply-media" /tmp/apply.js
          grep -F "I can test or review PRT in a real workflow and send honest feedback." /tmp/apply.js

          driver_code=$(curl --silent --show-error -o /tmp/driver.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"Smoke Test","email":"smoke-driver@example.com","discord_username":"","iracing_name":"","disciplines":["Asphalt Oval"],"race_frequency":"1–2 days per week","current_tools":"","goals":"","can_test":true,"bug_reports":true,"honest_feedback":true,"expectations_agreed":true,"company_website":"","campaign":"","source":"website","asset":"","placement":"quick-apply-driver"}' \
            "$BASE/api/prt/apply")
          test "$driver_code" = '400'
          grep -F 'Enter your iRacing display name.' /tmp/driver.json

          broadcast_code=$(curl --silent --show-error -o /tmp/broadcast.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"Smoke Test","email":"smoke-broadcast@example.com","discord_username":"","iracing_name":"","disciplines":["Broadcaster / Production"],"race_frequency":"Every week","current_tools":"","goals":"","can_test":true,"bug_reports":true,"honest_feedback":true,"expectations_agreed":true,"company_website":"","campaign":"","source":"website","asset":"","placement":"quick-apply-broadcaster"}' \
            "$BASE/api/prt/apply")
          test "$broadcast_code" = '400'
          grep -F 'Enter your organization / outlet / project name.' /tmp/broadcast.json

          echo 'Live role-aware PRT apply smoke OK'
