name: Apply PRT Audience Fit

on:
  push:
    branches:
      - growth/prt-audience-fit
    paths:
      - '.github/workflows/prt-audience-fit-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/prt-audience-fit
          fetch-depth: 0
      - name: Apply approved audience-fit section
        run: python scripts/apply_prt_audience_fit.py
      - name: Commit landing-page change
        run: |
          rm scripts/apply_prt_audience_fit.py
          rm .github/workflows/prt-audience-fit-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/prt.html api/prt-growth.css scripts/apply_prt_audience_fit.py .github/workflows/prt-audience-fit-apply.yml
          git commit -m "feat: add PRT audience-fit growth section"
          git push origin HEAD:growth/prt-audience-fit
