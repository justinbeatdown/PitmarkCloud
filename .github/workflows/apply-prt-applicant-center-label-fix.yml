name: Apply PRT Applicant Center Label Fix

on:
  push:
    branches:
      - fix/prt-role-aware-applicant-center
    paths:
      - 'scripts/apply_prt_applicant_center_label_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prt-role-aware-applicant-center
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Applicant Center patch
        run: python scripts/apply_prt_applicant_center_label_fix.py
      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/early_access_admin.py
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "fix: make PRT Applicant Center role-aware"
          git push origin HEAD:fix/prt-role-aware-applicant-center
