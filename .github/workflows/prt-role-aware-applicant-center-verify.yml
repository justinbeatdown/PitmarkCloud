name: PRT Role-Aware Applicant Center Verify

on:
  pull_request:
    paths:
      - 'api/early_access_admin.py'
      - 'services/prt_applications.py'
      - 'scripts/test_prt_role_aware_applicant_center.py'
      - 'scripts/test_social_ops_shutdown_contract.py'
      - '.github/workflows/prt-role-aware-applicant-center-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify role-aware Applicant Center contract
        run: python scripts/test_prt_role_aware_applicant_center.py
      - name: Preserve Social Operations shutdown contract
        run: python scripts/test_social_ops_shutdown_contract.py
