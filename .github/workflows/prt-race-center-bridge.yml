name: PRT Race Center pairing validation
on:
  pull_request:
    paths:
      - 'api/prt_race_center_bridge.py'
      - 'api/prt_connect.css'
      - 'api/prt_connect.js'
      - 'tests/test_prt_connect_csp_contract.py'
      - 'api/race_center_profile.*'
      - 'api/race_center_admin.*'
      - 'tests/test_race_center_staff_admin_runtime.py'
      - 'api/race_center_prt_profile.css'
      - 'api/standings_public.html'
      - 'api/standings_public.js'
      - 'tests/test_prt_racer_profile_dashboard_contract.py'
      - 'services/race_center_follower_notifications.py'
      - 'services/race_center_accounts.py'
      - 'tests/test_race_center_social_avatar_runtime.py'
      - 'tests/test_race_center_social_avatar_wall_contract.py'
      - 'tests/test_race_center_public_social_lists_runtime.py'
      - 'tests/test_race_center_profile_social_lists_contract.py'
      - 'api/race_center_refined.css'
      - 'tests/test_race_center_official_partner_badge_contract.py'
      - 'tests/test_race_center_official_partner_runtime.py'
      - 'services/database.py'
      - 'api/standings_public.py'
      - 'tests/test_prt_public_race_history_runtime.py'
      - 'main.py'
      - 'tests/test_prt_race_center_bridge_contract.py'
      - '.github/workflows/prt-race-center-bridge.yml'
  push:
    paths:
      - 'api/prt_race_center_bridge.py'
      - 'api/prt_connect.css'
      - 'api/prt_connect.js'
      - 'tests/test_prt_connect_csp_contract.py'
      - 'main.py'
      - 'tests/test_prt_race_center_bridge_contract.py'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_prt_race_center_bridge_contract.py
      - run: python tests/test_prt_connect_csp_contract.py
      - run: python tests/test_prt_racer_profile_dashboard_contract.py
      - run: python tests/test_race_center_social_avatar_wall_contract.py
      - run: python tests/test_race_center_profile_social_lists_contract.py
      - run: node --check api/standings_public.js
      - run: node --check api/prt_connect.js
      - run: python tests/test_race_center_official_partner_badge_contract.py
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/test_race_center_social_avatar_runtime.py
      - run: PYTHONPATH=. python tests/test_race_center_public_social_lists_runtime.py
      - run: PYTHONPATH=. python tests/test_race_center_staff_admin_runtime.py
      - run: PYTHONPATH=. python tests/test_race_center_official_partner_runtime.py
      - run: PYTHONPATH=. python tests/test_prt_public_race_history_runtime.py
      - run: PYTHONPATH=. python tests/test_prt_bridge_import_smoke.py
      - run: node --check api/race_center_profile.js
