name: Control Center 2026 Verify

on:
  pull_request:
    paths:
      - 'api/control_center.py'
      - 'api/control_center_2026.py'
      - 'api/control_center_hq.py'
      - 'api/control_center_ui.py'
      - 'api/control_center.html'
      - 'api/control_mobile.html'
      - 'api/control_center_overhaul.css'
      - 'api/control_center_overhaul.js'
      - 'api/control_center_app.js'
      - 'api/control_center_api.js'
      - 'api/control_center_views.js'
      - 'api/control_sw.js'
      - 'api/__init__.py'
      - 'services/google_workspace_auth.py'
      - 'services/google_gmail.py'
      - 'services/master_checklist.py'
      - 'scripts/test_control_center_2026_contract.py'
      - 'scripts/test_control_center_lowrisk_runtime.py'
      - 'scripts/test_control_center_pwa_retirement.py'
      - 'scripts/test_master_checklist_contract.py'
      - 'scripts/test_workspace_focus_frame.py'
  push:
    branches: [main]
    paths:
      - 'api/control_center_2026.py'
      - 'api/control_center_hq.py'
      - 'api/control_center_ui.py'
      - 'api/control_center.html'
      - 'api/control_mobile.html'
      - 'api/control_center_overhaul.css'
      - 'api/control_center_overhaul.js'
      - 'api/control_center_app.js'
      - 'api/control_center_api.js'
      - 'api/control_center_views.js'
      - 'api/control_sw.js'
      - 'api/__init__.py'
      - 'services/google_workspace_auth.py'
      - 'services/google_gmail.py'
      - 'services/master_checklist.py'
      - 'scripts/test_control_center_2026_contract.py'
      - 'scripts/test_control_center_pwa_retirement.py'
      - 'scripts/test_master_checklist_contract.py'
      - 'scripts/test_workspace_focus_frame.py'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Control Center contract tests
        run: python scripts/test_control_center_2026_contract.py -v
      - name: Run low-risk Control Center scheduler runtime test
        run: python scripts/test_control_center_lowrisk_runtime.py -v
      - name: Run Control Center PWA retirement tests
        run: python scripts/test_control_center_pwa_retirement.py -v
      - name: Run Master Checklist contract tests
        run: python scripts/test_master_checklist_contract.py -v
      - name: Run workspace focus-frame regression test
        run: python scripts/test_workspace_focus_frame.py -v
      - name: Compile Control Center APIs
        run: |
          python -m py_compile api/control_center.py api/control_center_2026.py api/control_center_ui.py api/__init__.py
          if [ -f api/control_center_hq.py ]; then python -m py_compile api/control_center_hq.py; fi
          if [ -f services/google_workspace_auth.py ]; then python -m py_compile services/google_workspace_auth.py; fi
          if [ -f services/master_checklist.py ]; then python -m py_compile services/master_checklist.py; fi
      - name: Check JavaScript syntax
        run: |
          node --check api/control_center_overhaul.js
          if [ -f api/control_center_app.js ]; then node --check api/control_center_app.js; fi
          if [ -f api/control_center_api.js ]; then node --check api/control_center_api.js; fi
          if [ -f api/control_center_views.js ]; then node --check api/control_center_views.js; fi
          if [ -f api/control_sw.js ]; then node --check api/control_sw.js; fi
