name: PRT beta tester Discord role verify

on:
  push:
    branches:
      - feature/prt-beta-tester-discord-role
  pull_request:
    paths:
      - 'services/discord_gateway_service.py'
      - 'api/discord.py'
      - 'utils/config.py'
      - '.env.example'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules
        run: python -m py_compile services/discord_gateway_service.py api/discord.py utils/config.py