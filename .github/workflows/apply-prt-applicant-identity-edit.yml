name: Apply PRT Applicant Identity Edit

on:
  push:
    branches:
      - fix/prt-applicant-identity-edit
    paths:
      - 'scripts/apply_prt_applicant_identity_edit.py'
      - '.github/workflows/apply-prt-applicant-identity-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prt-applicant-identity-edit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Applicant Center patch
        run: python scripts/apply_prt_applicant_identity_edit.py
      - name: Remove temporary patch helper
        run: |
          git rm scripts/apply_prt_applicant_identity_edit.py
          git rm .github/workflows/apply-prt-applicant-identity-edit.yml
      - name: Commit patched Applicant Center
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/early_access_admin.py
          git commit -m 'feat: add safe Applicant Center identity correction'
          git push origin HEAD:fix/prt-applicant-identity-edit
