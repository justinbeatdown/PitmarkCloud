name: PRT Android

on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/prt-android.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/prt-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle -p mobile/android assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PRT-Mobile-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
